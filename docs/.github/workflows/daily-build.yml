name: Daily article build

on:
  schedule:
    - cron: '0 7 * * *'   # runs every day at 7:00 AM UTC
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to push articles.json back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run build script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py

      - name: Commit and push updated articles
        run: |
          git config user.name  "Climate Signal Bot"
          git config user.email "bot@climate-signal"
          git add docs/articles.json
          git diff --staged --quiet || git commit -m "Daily article update $(date -u +'%Y-%m-%d')"
          git push
